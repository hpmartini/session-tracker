name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report selftest
        run: bin/session-report --selftest
      - name: Typecheck tracker and menubar
        run: swiftc -typecheck tracker/session-tracker.swift && swiftc -typecheck tracker/session-menubar.swift
      - name: Dashboard cache tests
        run: python3 -I -m unittest discover -s tests
      - name: Syntax of installer and Python tools
        run: |
          sh -n install.sh
          python3 -m py_compile bin/session-dashboard bin/session-backfill scripts/make-demo-db.py
  dashboard-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Dashboard browser tests (installed Chrome, demo database)
        run: npx playwright test
